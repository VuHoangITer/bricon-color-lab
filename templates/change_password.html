{% extends "base.html" %}
{% block title %}Đổi mật khẩu – BRICON COLOR LAB{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Đổi mật khẩu</h1>
</div>
<section class="card" style="max-width:420px">
  <form method="post">
    <label>Mật khẩu hiện tại
      <input type="password" name="mat_khau_hien_tai" required autofocus>
    </label>
    <label>Mật khẩu mới
      <input type="password" name="mat_khau_moi" required minlength="4">
    </label>
    <label>Xác nhận mật khẩu mới
      <input type="password" name="xac_nhan" required minlength="4">
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
      <a class="btn" href="{{ url_for('colors.index') }}">Hủy</a>
    </div>
  </form>
</section>
{% endblock %}
